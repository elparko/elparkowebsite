name = "elparko-answers"
main = "src/index.js"
compatibility_date = "2026-11-01"

[ai]
binding = "AI"

[vars]
MODEL = "@cf/google/gemma-4-26b-a4b-it"

# Six questions a minute from one address, counted per Cloudflare location.
[[ratelimits]]
name = "LIMIT"
namespace_id = "4101"

  [ratelimits.simple]
  limit = 6
  period = 60
